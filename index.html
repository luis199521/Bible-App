<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblia</title>

  <!-- ✅ Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-1ycn6IcaQQ40/MKB4Imkb9z8e1QZr+..."
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>

<body class="bg-gray-100 text-gray-900">

  <!-- ✅ Hero Section -->
  <div class="w-full bg-green-600 text-white text-center py-12 px-4">
    <h1 class="text-3xl font-bold mb-4">Ahora es mucho más fácil leer la Biblia</h1>
    <img src="/img/holy-bible-with-rays-light-coming-out-ai-generative.jpg" alt="Biblia" class="mx-auto max-w-md rounded shadow-lg" />
    <p class="mt-4 text-lg">Podrás meditar en las enseñanzas que Dios tiene para ti</p>
  </div>

  <!-- ✅ Search Form -->
  <div class="max-w-4xl mx-auto mt-10 px-4">
    <div class="flex gap-4">
      <input
        id="inputPassage"
        type="text"
        placeholder="Ingresa el pasaje que deseas leer"
        class="flex-grow px-4 py-3 border border-gray-300 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-green-500"
      />
      <button
        id="send"
        type="submit"
        class="px-6 py-3 bg-gray-700 text-white rounded-lg hover:bg-gray-800 transition"
      >
        <i class="fas fa-search"></i>
      </button>
    </div>
  </div>

  <!-- ✅ Bible Output -->
  <div class="max-w-4xl mx-auto mt-10 px-4">
    <div id="bible" class="bg-white p-6 rounded-lg shadow-md">
      <!-- Aquí se mostrará el pasaje bíblico -->
    </div>
  </div>

  <!-- ✅ Custom Script -->
  <script src="/js/index.js"></script>
</body>

</html>
